[package]
name = "busd-server"
description = "Generic local message bus and IPC broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "busd"
path = "src/main.rs"

[features]
default = ["unix"]
unix = ["dep:busd-transport-unix"]
dbus = ["dep:busd-transport-dbus"]
monitoring = []

[dependencies]
busd-broker = { package = "busd-broker", path = "../bus-broker", version = "0.1.0" }
busd-client = { package = "busd-client", path = "../bus-client", version = "0.1.0" }
busd-policy = { package = "busd-policy", path = "../bus-policy", version = "0.1.0" }
busd-protocol = { package = "busd-protocol", path = "../bus-protocol", version = "0.1.0" }
busd-transport-unix = { package = "busd-transport-unix", path = "../bus-transport-unix", version = "0.1.0", optional = true }
busd-transport-dbus = { package = "busd-transport-dbus", path = "../bus-transport-dbus", version = "0.1.0", optional = true }

[dev-dependencies]
busd-client = { package = "busd-client", path = "../bus-client", version = "0.1.0" }

[lints]
workspace = true
